# =========================================================
# APPLICATION
# =========================================================
spring.application.name=Mooble

server.address=0.0.0.0
server.port=9091

# Required when running behind Cloudflare / proxy
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto


# =========================================================
# DATABASE (MySQL via Docker)
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# =========================================================
# REDIS (Shared for Spring Cache + Hibernate 2LC)
# =========================================================
#spring.redis.host=127.0.0.1
#spring.redis.port=6379

# =========================================================
# SPRING CACHE (Redis)
# =========================================================
spring.cache.type=none
spring.cache.redis.time-to-live=300s

spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false



# =========================================================
# MINIO (Internal Docker networking)
# =========================================================
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=tuition-resources


# =========================================================
# FILE UPLOAD LIMITS
# =========================================================
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB


# =========================================================
# MAIL (Secrets via environment)
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# APP URL (Cloudflare-facing)
# =========================================================
app.baseUrl=${APP_BASE_URL}
app.superUserEmail=${SUPER_USER_EMAIL}
app.superUserPass = ${SUPER_USER_PASS}


# =========================================================
# JWT SECRET KEY
# =========================================================
jwt.secretKey=${JWT_SECRET}


# =========================================================
# LOGGING (PRODUCTION SAFE)
# =========================================================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=WARN

# =========================================================
# HIBERNATE PERFORMANCE
# =========================================================
spring.jpa.properties.hibernate.generate_statistics=false
